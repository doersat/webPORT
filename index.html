<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <section class="slide slide-1">
        <div class="bg-line line-1"></div>
        <div class="bg-line line-2"></div>

        
        <img src="images/star 1.png" alt="Звезда" class="green-star gs-1">

        <img src="images/star 1.png" alt="Звезда" class="green-star gs-3">

        <div class="portfolio-text">
            <span class="letter">P</span>
            <span class="letter">O</span>
            <span class="letter">R</span>
            <span class="letter">T</span>
            <span class="letter">F</span>
            <span class="letter">O</span>
            <span class="letter">L</span>
            <span class="letter">I</span>
            <span class="letter">O</span>
        </div>

        <img src="images/rat.png" alt="Крыса" class="rat-img rat-1">
        <img src="images/girl.png" alt="Девочка" class="girl-img girl-1">

        <
        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-1">

        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-3">
        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-4">

        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-7">

    <!-- СЛАЙД 2 -->
    <section class="slide slide-2">
        <h1 class="slide-title">В каких школах<br>я обучалась?</h1>

        <div class="schools-container">
            <div class="school-card">
                <div class="school-logo kodland">kodland</div>
                <div class="school-info">5 курсов</div>
                <div class="school-info">14400 мин</div>
            </div>
            <div class="school-card">
                <div class="school-logo iserv">iserv</div>
                <div class="school-info">5 курсов</div>
                <div class="school-info">14400 мин</div>
            </div>
            <div class="school-card">
                <div class="school-logo yudaev">Yudaev<br>school</div>
                <div class="school-info">интенсив</div>
                <div class="school-info">300 мин</div>
            </div>
        </div>

        <img src="images/rat.png" alt="Крыса" class="rat-img rat-2">
        <img src="images/dog.png" alt="Собака" class="dog-img">


        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-8">
        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-9">
        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-10">

    <section class="slide slide-3">
        <h1 class="slide-title">Что я умею?</h1>

        <div class="skills-container">

            <div class="skill-oval skill-9">Разработка ML</div>
        </div>

        <img src="images/girl2.png" alt="Девочка" class="girl-img girl-3">

        
        <img src="images/star2.png" alt="Звезда" class="yellow-star ys-11">
